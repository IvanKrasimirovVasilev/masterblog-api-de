<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Posts</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/styles.css">
</head>
<body>
    <div class="container">
        <h1>📚 Blog Posts <span id="backend-status"></span></h1>
        <div class="input-field">
            <input type="text" id="api-base-url" placeholder="Enter API Base URL" value="http://127.0.0.1:5002/api">
            <button onclick="loadPosts()">Load Posts</button>
        </div>
        <div class="input-field">
            <input type="text" id="post-title" placeholder="Enter Post Title">
            <input type="text" id="post-content" placeholder="Enter Post Content">
            <input type="text" id="post-author" placeholder="Author">
            <input type="date" id="post-date">

            <button onclick="addPost()">Add Post</button>
        </div>
        <div class="input-field">
            <input type="text" id="search-input" placeholder="Search posts...">
            <button onclick="searchPosts()">Search</button>
        </div>
        <div class="input-field sort-field">

            <div>
                <label for="sortField">Sort by:</label>
            <select id="sortField">
                <option value="title">Title</option>
                <option value="content">Content</option>
                <option value="author">Author</option>
                <option value="date">Date</option>
            </select>
            </div>

            <div>
                <label for="directionSort">Direction:</label>
            <select id="directionSort">
                <option value="asc">Ascending</option>
                <option value="desc">Descending</option>
            </select>
            </div>


            <button onclick="sortPosts()">Sort</button>
        </div>
        <div id="post-container">
            <!-- Blog posts will be inserted here by JavaScript -->
        </div>
    </div>

    <script src="static/main.js"></script>
</body>
</html>
